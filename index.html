<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f5f3">
<title>Agent Desk — Trading Research Console</title>
<style>
:root{--paper:#f4f5f3;--card:#fff;--ink:#202521;--muted:#909791;--line:#e8ebe7;--green:#337d5e;--green-bg:#e9f3ec;--amber:#c78c4c;--red:#bb6866;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:13px var(--sans)}button{font:inherit}button:focus-visible{outline:2px solid #6a9c7b;outline-offset:2px}.desk{max-width:1500px;margin:auto;padding:18px 22px 30px}.top{height:43px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #e4e7e3;padding-bottom:13px}.logo{width:23px;height:23px;border-radius:6px;background:#a5c846;display:grid;place-items:center;color:#23331e;font-weight:900;font-size:14px}.brand{font-weight:800;font-size:12px;letter-spacing:.04em}.brand em{font-style:normal;color:#b45c5d;font-family:var(--mono);font-size:9px;margin-left:4px}.top-right{margin-left:auto;display:flex;align-items:center;gap:17px}.preview{font:8px var(--mono);letter-spacing:.1em;color:#a67a44;background:#faf3e9;border:1px solid #f0e5d5;border-radius:20px;padding:5px 8px}.live{font:8px var(--mono);color:var(--green);background:var(--green-bg);border-radius:20px;padding:5px 9px;letter-spacing:.05em}.live:before{content:"";display:inline-block;width:6px;height:6px;background:#56a176;border-radius:50%;margin-right:5px}.top-time{font:9px var(--mono);color:#737a74}.top-actions{display:flex;gap:7px}.btn{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:5px;padding:6px 9px;color:#626a63;font-size:9px}.btn.dark{background:#2c4334;border-color:#2c4334;color:#fff}.btn:hover{filter:brightness(.97)}.page-title{margin:20px 0 12px;display:flex;align-items:end;justify-content:space-between}.page-title h1{font-size:18px;letter-spacing:-.04em;margin:0;font-weight:650}.page-title p{margin:4px 0 0;color:#9aa19b;font-size:9px}.page-title .hint{font:8px var(--mono);color:#a2a8a2;letter-spacing:.08em}.top-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.card{background:var(--card);border:1px solid var(--line);border-radius:7px;box-shadow:0 1px 4px #24382b08}.metric{height:96px;padding:11px 12px;position:relative;overflow:hidden}.metric label,.section-label{font:8px var(--mono);letter-spacing:.08em;color:#959c96;text-transform:uppercase}.metric .value{font:500 21px var(--mono);letter-spacing:-.06em;margin:10px 0 3px;color:#26322a}.metric .value small{font-size:11px;color:#6d776f;letter-spacing:0}.metric .sub{font-size:8px;color:#9ca39d}.gain{color:var(--green)!important}.metric .tag{position:absolute;right:10px;top:10px;font:7px var(--mono);color:#a0a69f;border:1px solid #edf0ed;border-radius:3px;padding:3px 4px}.upload-section{display:flex;gap:10px;align-items:center;margin-top:20px;padding:15px;background:var(--card);border:1px solid var(--line);border-radius:7px}.upload-section input[type="file"]{font-size:12px}.strategies-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:15px;margin-top:20px}.strategy-card{padding:15px;background:var(--card);border:1px solid var(--line);border-radius:7px}.strategy-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;border-bottom:1px solid var(--line);padding-bottom:10px}.strategy-title{font-size:14px;font-weight:700}.strategy-metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.s-metric{display:flex;flex-direction:column;gap:3px}.s-label{font:8px var(--mono);color:var(--muted);text-transform:uppercase}.s-val{font:12px var(--mono);font-weight:600}.disclaimer{margin:11px 2px 0;color:#a1a8a2;font-size:8px;display:flex;justify-content:space-between;gap:10px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,14px);opacity:0;background:#27392c;color:white;padding:9px 12px;border-radius:5px;font-size:9px;transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<main class="desk">
  <header class="top"><div class="logo">↗</div><div class="brand">AGENT DESK <em>| TRADING RESEARCH</em></div><div class="top-right"><span class="preview">REAL DATA</span><span class="live" id="liveBadge">ONLINE</span><time class="top-time" id="clock">08:00:00</time></div></header>
  <div class="page-title"><div><h1>Trading operations console</h1><p>Compare strategy backtest performances.</p></div></div>

  <section class="upload-section">
      <input type="file" id="csvUpload" accept=".csv" />
      <button class="btn dark" id="uploadBtn">Upload Strategy CSV</button>
  </section>

  <section class="strategies-grid" id="strategiesGrid">
      <!-- Strategy cards will be injected here via DOM API -->
  </section>

  <footer class="disclaimer"><span>NO LIVE TRADING · OFFLINE DASHBOARD</span><span>AGENT DESK</span></footer>
</main><div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
function showToast(t){const n=$('#toast');n.textContent=t;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),2300)}
function timeNow(){const d=new Date();return new Intl.DateTimeFormat('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:'Asia/Taipei'}).format(d)}$('#clock').textContent=timeNow();setInterval(()=>$('#clock').textContent=timeNow(),1000);

function createMetricElement(label, value) {
    const div = document.createElement('div');
    div.className = 's-metric';

    const lbl = document.createElement('span');
    lbl.className = 's-label';
    lbl.textContent = label;

    const val = document.createElement('span');
    val.className = 's-val';
    val.textContent = value;

    div.appendChild(lbl);
    div.appendChild(val);
    return div;
}

function addStrategyCard(data) {
    const grid = $('#strategiesGrid');
    const card = document.createElement('div');
    card.className = 'strategy-card';

    const header = document.createElement('div');
    header.className = 'strategy-header';
    const title = document.createElement('span');
    title.className = 'strategy-title';
    title.textContent = data.strategy_name;
    header.appendChild(title);

    const metrics = document.createElement('div');
    metrics.className = 'strategy-metrics';

    metrics.appendChild(createMetricElement('Total Trades', data.total_trades));
    metrics.appendChild(createMetricElement('Win/Loss Ratio', data.win_loss_ratio));
    metrics.appendChild(createMetricElement('Max Drawdown', data.max_drawdown + '%'));
    metrics.appendChild(createMetricElement('Annualized Return', data.annualized_return + '%'));
    metrics.appendChild(createMetricElement('Kelly Criterion', data.kelly));
    metrics.appendChild(createMetricElement('3Y Annualized', data['3y_annualized'] === 'N/A' ? 'N/A' : data['3y_annualized'] + '%'));
    metrics.appendChild(createMetricElement('5Y Annualized', data['5y_annualized'] === 'N/A' ? 'N/A' : data['5y_annualized'] + '%'));

    card.appendChild(header);
    card.appendChild(metrics);
    grid.appendChild(card);
}

$('#uploadBtn').addEventListener('click', async () => {
    const fileInput = $('#csvUpload');
    if (fileInput.files.length === 0) {
        showToast('Please select a CSV file first.');
        return;
    }

    const formData = new FormData();
    formData.append('file', fileInput.files[0]);

    try {
        const response = await fetch('/api/upload', {
            method: 'POST',
            body: formData
        });

        const result = await response.json();

        if (response.ok) {
            showToast('Strategy uploaded and metrics computed successfully.');
            addStrategyCard(result.data);
            fileInput.value = ''; // Reset input
        } else {
            showToast('Error: ' + result.error);
        }
    } catch (e) {
        showToast('Network error: ' + e.message);
    }
});
</script>
</body></html>
